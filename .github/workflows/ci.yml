name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: npm ci || npm install
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Go tests
        run: go test ./...
