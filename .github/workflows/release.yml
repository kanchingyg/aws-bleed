name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Upgrade npm for trusted publishing
        run: |
          set -euo pipefail
          npm install -g npm@latest
          npm -v

      - name: Install
        run: npm ci || npm install

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Publish to npm with provenance
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "npm already has ${NAME}@${VER}; skipping publish"
          else
            npm publish --access public --provenance || echo "::warning::npm OIDC not configured yet for ${NAME}; publish locally or configure trusted publisher"
          fi

      - name: Publish to JSR with provenance
        run: |
          set -euo pipefail
          npx -y jsr publish --allow-dirty

      - name: GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
